name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Release whose hosted MCP pilot evidence should be checked
        required: true
        default: 1.7.0
        type: string

permissions:
  contents: read

jobs:
  monorepo:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Audit workspace dependencies
        run: npm audit --audit-level=moderate

      - name: Build workspaces
        run: npm run build

      - name: Test workspaces
        run: npm test

      - name: Check production gate scripts
        run: |
          node --check scripts/production/dashboard-domain-preflight.mjs
          node --check scripts/production/dashboard-deployment-truth-check.mjs
          node --check scripts/production/dashboard-production-go.mjs
          node --check scripts/production/dashboard-shell-check.mjs
          node --check scripts/production/environment-parity-check.mjs
          node --check scripts/production/extract-vercel-deployment-url.mjs
          node --check scripts/production/external-dogfood-evidence-check.mjs
          node --check scripts/production/mcp-pilot-evidence-check.mjs
          node --check scripts/production/production-readiness-gate.mjs
          node --check scripts/production/workflow-production-guard-check.mjs
          node --check scripts/release/release-smoke.mjs

  e2e:
    runs-on: ubuntu-latest
    needs: monorepo
    strategy:
      matrix:
        node: [20, 22]
        python: ['3.10', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install workspace dependencies
        run: npm ci

      - name: Build workspaces
        run: npm run build

      - name: Install Python SDK dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e packages/sdk-python

      - name: Run cross-stack E2E compatibility check
        run: npm run test:e2e

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        working-directory: docs
        run: npm ci

      - name: Audit docs dependencies
        working-directory: docs
        run: npm audit --audit-level=moderate

      - name: Build docs
        working-directory: docs
        run: npm run build

  quickstart:
    runs-on: ubuntu-latest
    needs: monorepo
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Build workspaces
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare quickstart env
        run: cp ops/quickstart/.env.example ops/quickstart/.env

      - name: Boot hosted quickstart stack
        run: docker compose -f ops/quickstart/compose.yaml --env-file ops/quickstart/.env up -d --build

      - name: Run hosted quickstart smoke path
        run: npm run quickstart:smoke

      - name: Verify dashboard shell guard
        run: npm run production:dashboard-shell -- --dashboard-base http://localhost:43173

      - name: Run dashboard UI smoke path
        run: npm run quickstart:ui-smoke

      - name: Compare dashboard UI against baselines
        run: npm run quickstart:ui-compare -- --latest

      - name: Write dashboard UI smoke report
        run: npm run quickstart:ui-report -- --latest --output tmp/dashboard-ui-smoke/report.md

      - name: Upload quickstart UI smoke artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quickstart-ui-smoke
          path: tmp/dashboard-ui-smoke
          if-no-files-found: ignore

      - name: Tear down quickstart stack
        if: always()
        run: docker compose -f ops/quickstart/compose.yaml --env-file ops/quickstart/.env down -v --remove-orphans

  mcp-container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Build hardened MCP image
        run: npm run container:build --workspace=@beam-protocol/mcp-server

      - name: Run remote MCP container E2E
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/mcp-release-candidate
          npm run test:mcp-container-e2e | tee tmp/mcp-release-candidate/container-e2e.json

      - name: Record immutable local image identity
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect beam-mcp:local > tmp/mcp-release-candidate/image-inspect.json

      - name: Scan image for High and Critical vulnerabilities
        shell: bash
        env:
          TRIVY_IMAGE: aquasec/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/trivy-cache"
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "${RUNNER_TEMP}/trivy-cache:/root/.cache/trivy" \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            "$TRIVY_IMAGE" image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --skip-version-check \
            --no-progress \
            --format json \
            --output tmp/mcp-release-candidate/vulnerability-scan.json \
            beam-mcp:local

      - name: Generate CycloneDX SBOM
        shell: bash
        env:
          TRIVY_IMAGE: aquasec/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e
        run: |
          set -euo pipefail
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "${RUNNER_TEMP}/trivy-cache:/root/.cache/trivy" \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            "$TRIVY_IMAGE" image \
            --skip-version-check \
            --no-progress \
            --format cyclonedx \
            --output tmp/mcp-release-candidate/beam-mcp.cdx.json \
            beam-mcp:local

      - name: Hash candidate evidence
        shell: bash
        run: sha256sum tmp/mcp-release-candidate/* > tmp/mcp-release-candidate/SHA256SUMS

      - name: Upload MCP candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mcp-release-candidate-${{ github.sha }}
          path: tmp/mcp-release-candidate
          if-no-files-found: error
          retention-days: 30

  mcp-pilot-evidence:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: mcp-container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Verify external hosted MCP pilot evidence
        shell: bash
        env:
          DISPATCH_RELEASE: ${{ inputs.release }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${TAG_NAME#v}"
            PACKAGE_VERSION="$(node -p "require('./package.json').version")"
            test "$VERSION" = "$PACKAGE_VERSION" || {
              echo "Tag version $VERSION does not match package.json version $PACKAGE_VERSION" >&2
              exit 1
            }
          else
            VERSION="$DISPATCH_RELEASE"
          fi
          test -n "$VERSION" || { echo "MCP pilot release cannot be empty" >&2; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "MCP pilot release must be a safe semantic version: $VERSION" >&2
            exit 1
          }
          EVIDENCE="reports/${VERSION}-mcp-pilot-evidence.json"
          test -f "$EVIDENCE" || { echo "Required hosted MCP pilot evidence is missing: $EVIDENCE" >&2; exit 1; }
          npm run production:mcp-pilot -- \
            --release "$VERSION" \
            --evidence "$EVIDENCE" \
            --output "tmp/${VERSION}-mcp-pilot-evidence-check.md"

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [monorepo, e2e, docs, quickstart, mcp-container, mcp-pilot-evidence]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Build workspaces
        run: npm run build

      - name: Publish SDK to npm
        run: npm publish --workspace=packages/sdk-typescript --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish CLI to npm
        run: npm publish --workspace=packages/cli --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  deploy-directory:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Prepare tagged release metadata
        env:
          TAG_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          VERSION="${TAG_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version $VERSION does not match package.json version $PACKAGE_VERSION" >&2
            exit 1
          fi

          DEPLOYED_AT="$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")"

          node scripts/release/write-directory-release-metadata.mjs \
            --version "$VERSION" \
            --git-sha "$GITHUB_SHA" \
            --deployed-at "$DEPLOYED_AT"

          echo "BEAM_RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BEAM_RELEASE_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "BEAM_DEPLOYED_AT=$DEPLOYED_AT" >> "$GITHUB_ENV"

      - name: Install Flyctl
        run: curl -L https://fly.io/install.sh | FLYCTL_INSTALL=/home/runner/.fly sh

      - name: Clear stale Fly release env overrides
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          test -n "$FLY_API_TOKEN" || { echo "Missing FLY_API_TOKEN repo secret" >&2; exit 1; }
          /home/runner/.fly/bin/flyctl secrets unset \
            BEAM_RELEASE_VERSION \
            BEAM_RELEASE_SHA \
            BEAM_DEPLOYED_AT \
            --app beam-protocol \
            --stage || true

      - name: Deploy directory API to Fly.io
        working-directory: packages/directory
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          test -n "$FLY_API_TOKEN" || { echo "Missing FLY_API_TOKEN repo secret" >&2; exit 1; }
          /home/runner/.fly/bin/flyctl deploy \
            --config fly.toml \
            --app beam-protocol \
            --remote-only \
            --yes

      - name: Verify live API release truth
        run: |
          node scripts/release/verify-api-release-truth.mjs \
            --base-url "https://api.beam.directory" \
            --version "$BEAM_RELEASE_VERSION" \
            --git-sha "$BEAM_RELEASE_SHA" \
            --deployed-at "$BEAM_DEPLOYED_AT"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish, deploy-directory]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          NOTES_FILE="reports/${VERSION}-release-notes-draft.md"

          if [ ! -f "$NOTES_FILE" ]; then
            echo "Expected release notes file not found: $NOTES_FILE" >&2
            exit 1
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --title "$TAG_NAME" \
              --notes-file "$NOTES_FILE" \
              --latest
          else
            gh release create "$TAG_NAME" \
              --verify-tag \
              --title "$TAG_NAME" \
              --notes-file "$NOTES_FILE" \
              --latest
          fi
