name: Deploy Public Site

# Requires:
# - repo secret `VERCEL_TOKEN`
# - repo variable `VERCEL_ORG_ID`
# - repo variable `VERCEL_PUBLIC_SITE_PROJECT_ID`

on:
  push:
    branches: [main]
    paths:
      - 'packages/public-site/**'
      - '.github/workflows/public-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-site-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PUBLIC_SITE_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_CLI_VERSION: '54.4.1'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Resolve deployment readiness
        id: config
        run: |
          ready=true
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "Missing VERCEL_TOKEN repo secret"
            ready=false
          fi
          if [ -z "$VERCEL_ORG_ID" ]; then
            echo "Missing VERCEL_ORG_ID repo variable"
            ready=false
          fi
          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Missing VERCEL_PUBLIC_SITE_PROJECT_ID repo variable"
            ready=false
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      - name: Fail deploy when Vercel config is missing
        if: ${{ steps.config.outputs.ready != 'true' }}
        run: |
          echo "Public-site deploy is not production-safe because Vercel configuration is incomplete." >&2
          exit 1

      - name: Install Vercel CLI
        if: ${{ steps.config.outputs.ready == 'true' }}
        run: npm install --global "vercel@$VERCEL_CLI_VERSION"

      - name: Validate Vercel token and public-site project access
        if: ${{ steps.config.outputs.ready == 'true' }}
        run: |
          VERCEL_USER="$(vercel whoami --token "$VERCEL_TOKEN")"
          echo "Vercel token accepted for ${VERCEL_USER}"

          vercel project inspect "$VERCEL_PROJECT_ID" \
            --token "$VERCEL_TOKEN" \
            --non-interactive > /dev/null
          echo "Vercel public-site project access confirmed"

      - name: Pull production project settings
        if: ${{ steps.config.outputs.ready == 'true' }}
        working-directory: packages/public-site
        run: vercel pull --yes --environment=production --project "$VERCEL_PROJECT_ID" --token "$VERCEL_TOKEN"

      - name: Deploy beam.directory to production
        if: ${{ steps.config.outputs.ready == 'true' }}
        working-directory: packages/public-site
        run: vercel deploy --prod --yes --project "$VERCEL_PROJECT_ID" --token "$VERCEL_TOKEN"
