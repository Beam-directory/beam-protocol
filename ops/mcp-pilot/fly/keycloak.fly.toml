app = "beam-identity-pilot"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "../keycloak/Dockerfile"

[env]
  KC_DB = "postgres"
  KC_DB_URL_HOST = "beam-identity-db.internal"
  KC_DB_URL_PORT = "5432"
  KC_DB_URL_DATABASE = "keycloak"
  KC_DB_USERNAME = "keycloak"
  KC_DB_PASSWORD_FILE = "/run/secrets/keycloak_db_password"
  KC_BOOTSTRAP_ADMIN_USERNAME = "beam-bootstrap"
  KC_BOOTSTRAP_ADMIN_PASSWORD_FILE = "/run/secrets/keycloak_admin_password"
  KC_HOSTNAME = "https://identity.beam.directory"
  KC_HTTP_ENABLED = "true"
  KC_PROXY_HEADERS = "xforwarded"
  KC_HEALTH_ENABLED = "true"
  KC_METRICS_ENABLED = "true"
  KC_FEATURES = "cimd:v1,resource-indicators:v1"

[[files]]
  guest_path = "/run/secrets/keycloak_db_password"
  secret_name = "KEYCLOAK_DB_PASSWORD_B64"

[[files]]
  guest_path = "/run/secrets/keycloak_admin_password"
  secret_name = "KEYCLOAK_ADMIN_PASSWORD_B64"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/realms/master"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
