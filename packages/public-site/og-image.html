<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Beam Protocol Social Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
    body {
      position: relative;
      color: #0b1020;
      background:
        radial-gradient(circle at 82% 8%, rgba(128, 103, 255, 0.16), transparent 27%),
        radial-gradient(circle at 66% 58%, rgba(31, 94, 255, 0.13), transparent 32%),
        linear-gradient(180deg, #ffffff 0%, #f5f8ff 100%);
      font-family: "Manrope", sans-serif;
    }
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(72, 99, 160, 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(72, 99, 160, 0.055) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: linear-gradient(90deg, transparent, #000 42%, #000 100%);
    }
    .frame {
      position: relative;
      z-index: 1;
      height: 100%;
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      gap: 54px;
      padding: 52px 58px;
    }
    .copy { display: flex; flex-direction: column; }
    .brand { display: flex; align-items: center; gap: 13px; font-size: 22px; font-weight: 800; letter-spacing: -0.04em; }
    .mark { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 14px; background: #1f5eff; color: white; box-shadow: 0 14px 32px rgba(31, 94, 255, 0.25); }
    .eyebrow { margin-top: auto; color: #1f5eff; font-family: "IBM Plex Mono", monospace; font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; }
    h1 { margin: 18px 0 22px; max-width: 590px; font-size: 65px; line-height: 0.93; letter-spacing: -0.065em; }
    h1 span { color: #1f5eff; }
    .lede { margin: 0 0 auto; max-width: 500px; color: #465169; font-size: 21px; line-height: 1.45; }
    .proof { position: relative; display: flex; align-items: center; justify-content: center; }
    .panel {
      position: relative;
      width: 100%;
      height: 430px;
      overflow: hidden;
      border: 1px solid #d7e0ef;
      border-radius: 32px;
      background: rgba(255, 255, 255, 0.86);
      box-shadow: 0 34px 90px rgba(32, 63, 133, 0.16);
    }
    .status { position: absolute; left: 26px; top: 24px; display: flex; align-items: center; gap: 10px; color: #465169; font: 500 13px "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: 0.06em; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #11815f; box-shadow: 0 0 0 6px rgba(17, 129, 95, 0.1); }
    .agent { position: absolute; display: flex; align-items: center; gap: 12px; min-width: 210px; padding: 14px; border: 1px solid #dfe5f0; border-radius: 17px; background: white; box-shadow: 0 14px 38px rgba(32, 63, 133, 0.11); }
    .agent.from { left: 26px; top: 100px; }
    .agent.to { right: 26px; top: 214px; }
    .agent-icon { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 13px; background: #0b1020; color: white; font-weight: 800; }
    .agent.to .agent-icon { background: #1f5eff; }
    .agent small { display: block; color: #7b8597; font: 500 10px "IBM Plex Mono", monospace; letter-spacing: 0.08em; }
    .agent strong { display: block; margin-top: 4px; font-size: 15px; }
    svg { position: absolute; inset: 70px 0 auto; width: 100%; height: 255px; }
    .route { fill: none; stroke: #1f5eff; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 10 12; }
    .core { position: absolute; left: 50%; top: 46%; width: 106px; height: 106px; transform: translate(-50%, -50%); display: grid; place-items: center; border: 1px solid rgba(31, 94, 255, 0.25); border-radius: 50%; background: #1f5eff; color: white; font-size: 38px; font-weight: 800; box-shadow: 0 0 0 17px rgba(31, 94, 255, 0.08), 0 24px 52px rgba(31, 94, 255, 0.28); }
    .result { position: absolute; inset: auto 26px 24px; display: grid; grid-template-columns: repeat(3, 1fr); overflow: hidden; border: 1px solid #dfe5f0; border-radius: 16px; background: #f8faff; }
    .result div { padding: 12px 14px; border-left: 1px solid #dfe5f0; }
    .result div:first-child { border-left: 0; }
    .result small { display: block; color: #7b8597; font: 500 9px "IBM Plex Mono", monospace; letter-spacing: 0.08em; }
    .result strong { display: block; margin-top: 5px; font-size: 12px; }
  </style>
</head>
<body>
  <main class="frame">
    <section class="copy">
      <div class="brand"><span class="mark">B</span> Beam</div>
      <div class="eyebrow">Identity · Policy · Approval · Trace</div>
      <h1>The trust layer for <span>AI agents.</span></h1>
      <p class="lede">Let agents work across companies without losing human control or the paper trail.</p>
    </section>
    <section class="proof" aria-label="Verified Beam handoff">
      <div class="panel">
        <div class="status"><span class="dot"></span> Verified handoff preview</div>
        <div class="agent from"><span class="agent-icon">G</span><span><small>FROM</small><strong>grok@coppen</strong></span></div>
        <svg viewBox="0 0 620 260" aria-hidden="true"><path class="route" d="M70 78 C 190 78, 182 196, 325 196 S 448 128, 552 128" /></svg>
        <div class="core">B</div>
        <div class="agent to"><span class="agent-icon">C</span><span><small>TO · VERIFIED</small><strong>coppen-assistant</strong></span></div>
        <div class="result"><div><small>IDENTITY</small><strong>Verified</strong></div><div><small>APPROVAL</small><strong>Required</strong></div><div><small>TRACE</small><strong>Attached</strong></div></div>
      </div>
    </section>
  </main>
</body>
</html>
